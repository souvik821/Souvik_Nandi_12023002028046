[pytest]
minversion = 7.0
addopts = -v -s --html=reports/pytest_report.html --self-contained-html
testpaths = tests
python_files = test_*_pytest.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick sanity smoke tests
    regression: Full regression test scenarios
    login: Authentication test cases
    search: Product catalog search test cases
filterwarnings =
    ignore::DeprecationWarning
